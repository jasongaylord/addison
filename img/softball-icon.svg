<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- Softball background with gradient -->
  <defs>
    <radialGradient id="ballGradient" cx="0.3" cy="0.3" r="0.8">
      <stop offset="0%" style="stop-color:#FFFACD;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#F5DEB3;stop-opacity:1" />
    </radialGradient>
  </defs>
  
  <!-- Main ball -->
  <circle cx="50" cy="50" r="48" fill="url(#ballGradient)" stroke="#D2B48C" stroke-width="1"/>
  
  <!-- Left curved seam -->
  <path d="M15 35 Q25 25 35 30 Q45 35 50 50 Q45 65 35 70 Q25 75 15 65" 
        stroke="#DC143C" stroke-width="2.5" fill="none"/>
  
  <!-- Right curved seam -->
  <path d="M85 35 Q75 25 65 30 Q55 35 50 50 Q55 65 65 70 Q75 75 85 65" 
        stroke="#DC143C" stroke-width="2.5" fill="none"/>
  
  <!-- Stitching on left seam -->
  <g stroke="#DC143C" stroke-width="1.5" fill="none">
    <!-- Left side stitches -->
    <path d="M18 40 L22 38"/>
    <path d="M16 45 L20 43"/>
    <path d="M15 50 L19 48"/>
    <path d="M16 55 L20 57"/>
    <path d="M18 60 L22 62"/>
    
    <!-- Center stitches -->
    <path d="M47 45 L53 43"/>
    <path d="M46 50 L54 50"/>
    <path d="M47 55 L53 57"/>
  </g>
  
  <!-- Stitching on right seam -->
  <g stroke="#DC143C" stroke-width="1.5" fill="none">
    <!-- Right side stitches -->
    <path d="M82 40 L78 38"/>
    <path d="M84 45 L80 43"/>
    <path d="M85 50 L81 48"/>
    <path d="M84 55 L80 57"/>
    <path d="M82 60 L78 62"/>
  </g>
  
  <!-- Additional small stitches for detail -->
  <g stroke="#DC143C" stroke-width="1" fill="none">
    <path d="M30 32 L32 30"/>
    <path d="M35 38 L37 40"/>
    <path d="M40 42 L42 44"/>
    <path d="M40 58 L42 56"/>
    <path d="M35 62 L37 60"/>
    <path d="M30 68 L32 70"/>
    
    <path d="M70 32 L68 30"/>
    <path d="M65 38 L63 40"/>
    <path d="M60 42 L58 44"/>
    <path d="M60 58 L58 56"/>
    <path d="M65 62 L63 60"/>
    <path d="M70 68 L68 70"/>
  </g>
</svg>
